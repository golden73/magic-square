<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <!-- <script src="https://code.jquery.com/jquery-3.7.1.js"></script> -->
    <script src="./newindex.js"></script>
    <title>Magic Square</title>
</head>
<body>
    <h1>Magic Square</h1>
    <h2>3X3 Square</h2>
    
    <div class="container">
        
        <div style="margin-inline-start: 5%;">
            <h2 style="margin-top: 5%;margin-inline-start: -10px;">Rules</h2>
            <ul>
                <li>Fill in the missing numbers from 1 to 9.</li>
                <li>5 is always at the center.</li>
                <li>4 should be placed at one of the corner.</li>
                <li>Each row, column and diagonal should equal 15.</li>
            </ul>
        </div>
        <div id="gameboard">
            <input type="number" min="1" max="9" maxlength="1" name="" id="1" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="2" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="3" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="4" />
            <input type="number" min="5" max="5" maxlength="0" name="" value="5" id="5" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="6" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="7" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="8" />
            <input type="number" min="1" max="9" maxlength="1" name="" id="9" />
        </div>
        <div class="start">
            <button type="button" onclick="start()">Check</button>
            <button type="reset" onclick="Reset()">Reset</button>
            <br>
            <span class="display" id="span"></span>
        </div>
    </div>
    
</body>
</html>
