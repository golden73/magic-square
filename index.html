<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css" />
    <script src="./script.js" defer></script>
    <title>Magic Square</title>
</head>
<body>
    <header>
        <h1>Magic Square</h1>
        <h2>3X3 Square</h2>
    </header>
    
    <main class="container">
        <div class="rules-card">
            <h2>Rules</h2>
            <ul>
                <li>Fill in the missing numbers from 1-9.</li>
                <li><strong>5</strong> is locked at the center.</li>
                <li><strong>4</strong> must be in a corner.</li>
                <li>Rows, columns and diagonals must sum to <strong>15</strong>.</li>
            </ul>
        </div>

        <section class="game">
            <div id="gameboard">
                <input type="number" id="1" min="1" max="9">
                <input type="number" id="2" min="1" max="9">
                <input type="number" id="3" min="1" max="9">
                <input type="number" id="4" min="1" max="9">
                <span id="default_number">5</span>
                <input type="number" id="6" min="1" max="9">
                <input type="number" id="7" min="1" max="9">
                <input type="number" id="8" min="1" max="9">
                <input type="number" id="9" min="1" max="9">
            </div>

            <div class="start">
                <div class="btns">
                    <button type="button" onclick="start()">Check</button>
                    <button type="reset" onclick="Reset()">Reset</button>
                </div>
                <div>
                    <span class="display" id="display"></span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
